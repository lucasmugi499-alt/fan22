# Production. Starts clean and real-payments-disabled until a separate money launch gate.
#
# Every REPLACE_WITH_ marker below is a hard blocker: `npm run environment:prepare:production`
# refuses while any remains. See docs/ENVIRONMENT_PROVISIONING.md.
env:
  - variable: GOALPLACE_ENVIRONMENT
    value: production
    availability: [BUILD, RUNTIME]

  # Restated, not inherited — see the same block in apphosting.beta.yaml for why. A safety
  # floor that arrives by inheritance is a safety floor nobody can read off this file.
  - variable: GOALPLACE_TEAM_AUTHORITY_STAGE
    value: "retired"
    availability: [RUNTIME]
  - variable: GOALPLACE_FINALIZER_MODE
    value: "off"
    availability: [RUNTIME]
  - variable: GOALPLACE_FIELD_CAPTURE_MODE
    value: "off"
    availability: [RUNTIME]
  - variable: GOALPLACE_LEAGUE_ENTRY_MODE
    value: "off"
    availability: [RUNTIME]
  # Production is gateway-only (config/environments.json directOriginPolicy). This must be
  # "true" before GA, and can only be flipped once the gateway is deployed and sending the
  # shared secret — see Phase 6 of the remediation roadmap.
  - variable: GOALPLACE_REQUIRE_GATEWAY_SECRET
    value: "false"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT
    value: production
    availability: [BUILD]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT_VERSION
    value: env-production-unset
    availability: [BUILD]
  - variable: GOALPLACE_DATA_ORIGIN
    value: production
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_DEMO_LOGIN
    value: "false"
    availability: [BUILD]
  - variable: GOALPLACE_ALLOW_SEEDING
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_REAL_PAYMENTS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability: [BUILD]
  - variable: GOALPLACE_REQUIRE_APP_CHECK
    value: "true"
    availability: [RUNTIME]
  # Production authorizes from canonical assignments only. Startup asserts this.
  - variable: GOALPLACE_ACCESS_ENGINE_MODE
    value: assignments
    availability: [RUNTIME]
  - variable: GOALPLACE_SCHEDULER_AUTH_MODE
    value: oidc
    availability: [RUNTIME]
  - variable: GOALPLACE_SCHEDULER_AUDIENCE
    value: REPLACE_WITH_PRODUCTION_SCHEDULER_AUDIENCE
    availability: [RUNTIME]
  - variable: GOALPLACE_SCHEDULER_SERVICE_ACCOUNT_EMAILS
    value: REPLACE_WITH_PRODUCTION_SCHEDULER_SERVICE_ACCOUNT
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_DATA_MODE
    value: firebase
    availability: [BUILD]
  - variable: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
    value: "false"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_PRODUCTION_WEB_API_KEY
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_PRODUCTION_AUTH_DOMAIN
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_CLEAN_PRODUCTION_PROJECT
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_WITH_PRODUCTION_STORAGE_BUCKET
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_WITH_PRODUCTION_SENDER_ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_PRODUCTION_APP_ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    value: REPLACE_WITH_PRODUCTION_APP_CHECK_SITE_KEY
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_ID
    value: fg256
    availability: [BUILD]
  - variable: GOALPLACE_ADMIN_PROJECT_ID
    value: REPLACE_WITH_CLEAN_PRODUCTION_PROJECT
    availability: [RUNTIME]
  - variable: GOALPLACE_FIRESTORE_DATABASE_ID
    value: fg256
    availability: [RUNTIME]
  - variable: GOALPLACE_APP_BASE_URL
    value: https://goalplace256.com
    availability: [RUNTIME]
  - variable: GOALPLACE_EMAIL_FROM
    value: "GoalPlace256 <team@goalplace256.com>"
    availability: [RUNTIME]
  - variable: GOALPLACE_EMAIL_REPLY_TO
    value: support@goalplace256.com
    availability: [RUNTIME]
  - variable: RESEND_API_KEY
    secret: resendApiKey
    availability: [RUNTIME]
