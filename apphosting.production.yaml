# Production. Starts clean and real-payments-disabled until a separate money launch gate.
env:
  - variable: GOALPLACE_ENVIRONMENT
    value: production
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT
    value: production
    availability: [BUILD]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT_VERSION
    value: env-production-unset
    availability: [BUILD]
  - variable: GOALPLACE_DATA_ORIGIN
    value: production
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_DEMO_LOGIN
    value: "false"
    availability: [BUILD]
  - variable: GOALPLACE_ALLOW_SEEDING
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_REAL_PAYMENTS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_DATA_MODE
    value: firebase
    availability: [BUILD]
  - variable: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
    value: "false"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_PRODUCTION_WEB_API_KEY
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_PRODUCTION_AUTH_DOMAIN
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_CLEAN_PRODUCTION_PROJECT
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_WITH_PRODUCTION_STORAGE_BUCKET
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_WITH_PRODUCTION_SENDER_ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_PRODUCTION_APP_ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_ID
    value: fg256
    availability: [BUILD]
  - variable: GOALPLACE_ADMIN_PROJECT_ID
    value: REPLACE_WITH_CLEAN_PRODUCTION_PROJECT
    availability: [RUNTIME]
  - variable: GOALPLACE_FIRESTORE_DATABASE_ID
    value: fg256
    availability: [RUNTIME]
