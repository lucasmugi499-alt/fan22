# Beta. Fill with the beta Firebase web app values before deployment.
#
# Every REPLACE_WITH_ marker below is a hard blocker: `npm run environment:prepare:beta`
# refuses while any remains. See docs/ENVIRONMENT_PROVISIONING.md for the order to do it in.
env:
  - variable: GOALPLACE_ENVIRONMENT
    value: beta
    availability: [BUILD, RUNTIME]

  # Restated, not inherited. These four previously came from the apphosting.yaml base, which
  # meant beta's finalization activation and — far worse — its team authority sunset stage
  # were decided by a file named for no environment. An overlay that omits the stage inherits
  # whatever the base says today, and if the base is ever edited the omission silently changes
  # beta's authority model. scripts/lib/deploymentPlanes.test.ts requires all three overlays
  # to declare the stage and to agree.
  - variable: GOALPLACE_TEAM_AUTHORITY_STAGE
    value: "retired"
    availability: [RUNTIME]
  # Beta starts with every finalization pipeline off and raises each one after its own canary,
  # exactly as demo did. Inheriting `enabled` would arm a pipeline that was never proven here.
  - variable: GOALPLACE_FINALIZER_MODE
    value: "off"
    availability: [RUNTIME]
  - variable: GOALPLACE_FIELD_CAPTURE_MODE
    value: "off"
    availability: [RUNTIME]
  - variable: GOALPLACE_LEAGUE_ENTRY_MODE
    value: "off"
    availability: [RUNTIME]
  # Beta is served on its own origin during the pilot. Flip to "true" only once a gateway is
  # actually in front of it — src/proxy.ts rejects every request when this is on and no
  # gateway supplies the secret.
  - variable: GOALPLACE_REQUIRE_GATEWAY_SECRET
    value: "false"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT
    value: beta
    availability: [BUILD]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT_VERSION
    value: env-beta-unset
    availability: [BUILD]
  - variable: GOALPLACE_DATA_ORIGIN
    value: beta_test
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_DEMO_LOGIN
    value: "false"
    availability: [BUILD]
  - variable: GOALPLACE_ALLOW_SEEDING
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_REAL_PAYMENTS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability: [BUILD]
  - variable: GOALPLACE_REQUIRE_APP_CHECK
    value: "true"
    availability: [RUNTIME]
  # Beta authorizes from canonical assignments only. No legacy fallback.
  - variable: GOALPLACE_ACCESS_ENGINE_MODE
    value: assignments
    availability: [RUNTIME]
  - variable: GOALPLACE_SCHEDULER_AUTH_MODE
    value: oidc
    availability: [RUNTIME]
  - variable: GOALPLACE_SCHEDULER_AUDIENCE
    value: REPLACE_WITH_BETA_SCHEDULER_AUDIENCE
    availability: [RUNTIME]
  - variable: GOALPLACE_SCHEDULER_SERVICE_ACCOUNT_EMAILS
    value: REPLACE_WITH_BETA_SCHEDULER_SERVICE_ACCOUNT
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_DATA_MODE
    value: firebase
    availability: [BUILD]
  - variable: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
    value: "false"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_BETA_WEB_API_KEY
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_BETA_AUTH_DOMAIN
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_BETA_PROJECT_ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_WITH_BETA_STORAGE_BUCKET
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_WITH_BETA_SENDER_ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_BETA_APP_ID
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    value: REPLACE_WITH_BETA_APP_CHECK_SITE_KEY
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_ID
    value: fg256
    availability: [BUILD]
  - variable: GOALPLACE_ADMIN_PROJECT_ID
    value: REPLACE_WITH_BETA_PROJECT_ID
    availability: [RUNTIME]
  - variable: GOALPLACE_FIRESTORE_DATABASE_ID
    value: fg256
    availability: [RUNTIME]
  - variable: GOALPLACE_APP_BASE_URL
    value: https://beta.goalplace256.com
    availability: [RUNTIME]
  - variable: GOALPLACE_EMAIL_FROM
    value: "GoalPlace256 <team@goalplace256.com>"
    availability: [RUNTIME]
  - variable: GOALPLACE_EMAIL_REPLY_TO
    value: support@goalplace256.com
    availability: [RUNTIME]
  - variable: RESEND_API_KEY
    secret: resendApiKey
    availability: [RUNTIME]
  - variable: GOALPLACE_PAYMENTS_MODE
    value: sandbox
    availability: [RUNTIME]
