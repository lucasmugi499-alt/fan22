# The base configuration, and the one the DEMO backend actually builds from.
#
# ## Why this is demo's config, and why that is now safe
#
# App Hosting reads this file whenever a backend does not name an overlay. The audit's GP-08
# found the hazard in that: a backend created for beta and given no overlay inherits whatever
# is here, so it would come up as demo and write to the demo database — no mistake in the beta
# config required, only a forgotten flag at backend-creation time.
#
# The first fix made this file a refusal sentinel declaring `unconfigured`. That was wrong, and
# the demo rollout on 2026-08-29 proved it in about four minutes: **the live demo backend is
# itself un-overlaid.** It builds from this file, so a sentinel here fails the one backend that
# legitimately depends on the default. "Names no overlay" is not the same thing as "is
# misconfigured".
#
# The protection now sits where the danger actually is. `assertConfigMatchesProject()` runs in
# `next.config.ts` at build time and refuses when the project named by the configuration in
# force disagrees with the project the build is running against. A beta backend reading this
# file declares `manifest-quasar-479416-s7` while Cloud Build reports `goalplace-beta`, and the
# build stops. That catches the case whether or not an overlay was named, which the sentinel
# could not.
#
# `apphosting.demo.yaml` restates all of this, so demo is explicit either way. Keep the two in
# step: `scripts/lib/deploymentPlanes.test.ts` fails if they disagree on the authority stage.

env:
  - variable: GOALPLACE_FINALIZER_MODE
    value: "enabled"
    availability: [RUNTIME]
  # Team authority sunset stage: active | frozen | retired.
  #
  # `retired` since 2026-08-26, and declared HERE as well as in apphosting.yaml because which
  # of the two a backend actually reads is not visible from the CLI. An overlay that simply
  # omitted this would leave the App Hosting runtime on the `frozen` default while the
  # Functions runtime said `retired` — and the runtime on the older stage writes team
  # capabilities back into every projection it rebuilds, one user at a time.
  #
  # scripts/lib/deploymentPlanes.test.ts fails if this file and apphosting.yaml disagree, or
  # if either omits it. Unset falls back to `frozen`, so an absent declaration is not neutral.
  - variable: GOALPLACE_TEAM_AUTHORITY_STAGE
    value: "retired"
    availability: [RUNTIME]
  - variable: GOALPLACE_ENVIRONMENT
    value: demo
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT
    value: demo
    availability: [BUILD]
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT_VERSION
    value: env-demo-2026-07-30
    availability: [BUILD]
  - variable: GOALPLACE_DATA_ORIGIN
    value: synthetic_demo
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_DEMO_LOGIN
    value: "true"
    availability: [BUILD]
  - variable: GOALPLACE_ALLOW_SEEDING
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ALLOW_REAL_PAYMENTS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "true"
    availability: [BUILD]
  - variable: GOALPLACE_REQUIRE_APP_CHECK
    value: "false"
    availability: [RUNTIME]
  # Stage C: canonical assignments are authoritative, matching firestore.rules.next.
    # Legacy indexes are still read so the soak keeps recording divergence.
    # Both cutover gates read zero (npm run access:migrate:gate).
  - variable: GOALPLACE_ACCESS_ENGINE_MODE
    value: assignments
    availability: [RUNTIME]
  # The demo origin is served directly on the App Hosting default domain. Enabling this
    # before a gateway sits in front of it would make src/proxy.ts reject every request.
  - variable: GOALPLACE_REQUIRE_GATEWAY_SECRET
    value: "false"
    availability: [RUNTIME]
  - variable: GOALPLACE_SCHEDULER_AUTH_MODE
    value: shared_secret
    availability: [RUNTIME]
  - variable: GOALPLACE_FANTASY_SCORING_SECRET
    secret: goalplaceFantasyScoringSecret
    availability: [RUNTIME]
  # The receiving half of the payment-reconciliation credential.
  #
  # `functions/src/index.ts` declares this secret on the CALLING side, and no overlay declared
  # it here — so `reconcilePaymentIntents` called an endpoint whose expected secret was
  # undefined, `safeSecretEquals` correctly refused, and the scheduled job answered 503 every
  # ten minutes and did no work. Half a shared credential fails closed, which is right, and
  # silently, which is not.
  #
  # It references the SAME Secret Manager secret the function does rather than a copy of it.
  # Two secrets that have to hold equal values is a rotation that half-lands.
  - variable: GOALPLACE_RECONCILIATION_SECRET
    secret: GOALPLACE_RECONCILIATION_SECRET
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "true"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_DATA_MODE
    value: firebase
    availability: [BUILD]
  - variable: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
    value: "true"
    availability: [BUILD]
