# The un-overlaid base. NOT a deployable environment — it declares `unconfigured`.
#
# WHY THIS FILE IS NOT THE DEMO CONFIG ANY MORE
#
# App Hosting reads `apphosting.yaml` as the base and `apphosting.<environment>.yaml` on top
# of it, and which overlay a given backend was created with is not visible from the CLI. This
# file used to be a copy of the demo configuration — demo project id, demo API key, demo
# login on, investor tools on, App Check off. A backend created for beta and given no overlay
# therefore came up as demo and wrote to the demo database. That needed no mistake in the
# beta config, only a forgotten flag at backend-creation time.
#
# So the base now declares `GOALPLACE_ENVIRONMENT: unconfigured`, which
# `assertSafeProductionEnvironment()` rejects from `next.config.ts` at BUILD time. An
# un-overlaid backend fails to build and the error names the overlays. A deploy that refuses
# to build is cheaper than one that silently writes to the wrong database.
#
# WHAT STAYS HERE, AND WHY
#
# Because the base is merged rather than replaced, anything removed from here is inherited as
# unset by every overlay that does not restate it — and for several of these variables
# "unset" is not neutral, it is the unsafe value. So this file keeps exactly two categories:
#
#   1. Safety floors whose absent value is dangerous (the team authority sunset stage falls
#      back to `frozen`, which un-retires team capabilities one projection at a time).
#   2. Fail-closed defaults, so an overlay that forgets a flag inherits the strict answer
#      rather than the permissive one.
#
# It keeps NO project identity at all: no Firebase project id, API key, database id, or base
# URL. If this file ever acquires a project id again, the footgun is back.

env:
  # ---------------------------------------------------------------------------
  # 1. The refusal sentinel
  # ---------------------------------------------------------------------------
  - variable: GOALPLACE_ENVIRONMENT
    value: unconfigured
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GOALPLACE_ENVIRONMENT
    value: unconfigured
    availability:
      - BUILD

  # ---------------------------------------------------------------------------
  # 2. Safety floors — absence here is not neutral
  # ---------------------------------------------------------------------------

  # Team authority sunset stage: active | frozen | retired.
  #
  # `retired` since 2026-08-26, after the V1 drain read zero on both blocking counts. This
  # runtime needs it because the Next server owns access projection too: `access/projector.ts`
  # rebuilds an accessIndex document whenever an assignment changes, and `projectScopeIndex`
  # reads this variable to decide what a team bundle grants. Left at the `frozen` default, a
  # single assignment edit would write team capabilities back into a rebuilt projection and
  # quietly reopen what the migration closed.
  #
  # The Cloud Functions runtime holds its own copy in functions/.env.<project>. Both have to
  # say `retired`, because either one can rebuild a projection. Every overlay now restates it
  # rather than inheriting it, and scripts/lib/deploymentPlanes.test.ts requires agreement.
  - variable: GOALPLACE_TEAM_AUTHORITY_STAGE
    value: "retired"
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # 3. Fail-closed defaults — an overlay that forgets one inherits the strict answer
  # ---------------------------------------------------------------------------

  # Finalization is off by default. Demo raised each pipeline deliberately after a canary;
  # a new environment must do the same rather than inheriting an activation it never proved.
  - variable: GOALPLACE_FINALIZER_MODE
    value: "off"
    availability:
      - RUNTIME
  - variable: GOALPLACE_FIELD_CAPTURE_MODE
    value: "off"
    availability:
      - RUNTIME
  - variable: GOALPLACE_LEAGUE_ENTRY_MODE
    value: "off"
    availability:
      - RUNTIME
  - variable: GOALPLACE_ACCESS_ENGINE_MODE
    value: assignments
    availability:
      - RUNTIME
  - variable: GOALPLACE_ALLOW_DEMO_LOGIN
    value: "false"
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
    value: "false"
    availability:
      - BUILD
  - variable: GOALPLACE_ALLOW_SEEDING
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: GOALPLACE_ALLOW_REAL_PAYMENTS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_GOALPLACE_ENABLE_INVESTOR_TOOLS
    value: "false"
    availability:
      - BUILD
  - variable: GOALPLACE_REQUIRE_APP_CHECK
    value: "true"
    availability:
      - RUNTIME
